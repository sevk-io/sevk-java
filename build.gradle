plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'net.thebugmc.gradle.sonatype-central-portal-publisher' version '1.2.4'
}

group = 'io.sevk'
version = '1.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withJavadocJar()
    withSourcesJar()
}


configurations {
    bundledHighlight
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

processResources {
    filesMatching('io/sevk/sevk-version.properties') {
        expand(version: project.version)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jitpack.io') }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.fifesoft:rsyntaxtextarea:3.5.3'
    api 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.github.Codewaves:Highlight.java:1.0.2'
    bundledHighlight 'com.github.Codewaves:Highlight.java:1.0.2'
    testImplementation 'com.github.Codewaves:Highlight.java:1.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') {
    from {
        configurations.bundledHighlight.collect { dependency -> zipTree(dependency) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    from('THIRD_PARTY_LICENSES/Highlight.java-LICENSE.txt') {
        into 'META-INF/licenses'
    }
    from('LICENSE') {
        into 'META-INF'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

centralPortal {
    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')

    pom {
        name = 'Sevk Java SDK'
        description = 'Official Java SDK for the Sevk email platform'
        url = 'https://github.com/sevk-io/sevk-java'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'sevk'
                name = 'Sevk Team'
                email = 'support@sevk.io'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/sevk-io/sevk-java.git'
            developerConnection = 'scm:git:ssh://github.com/sevk-io/sevk-java.git'
            url = 'https://github.com/sevk-io/sevk-java'
        }
    }
}

signing {
    def signingKey = findProperty('signingKey') ?: System.getenv('GPG_PRIVATE_KEY')
    def signingKeyId = findProperty('signingKeyId')
    def signingPassword = findProperty('signingPassword')
    if (signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }
    sign publishing.publications
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}
